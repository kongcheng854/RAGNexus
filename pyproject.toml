[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragnexus"
version = "0.1.0"
description = "A minimal RAG indexing and retrieval service"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.4,<6",
    "redis>=5,<7",
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.20,<1",
    "langfuse>=2.0.0,<3.0.0",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
parsers = ["mammoth>=1.10,<2", "pymupdf>=1.24,<2", "markdownify>=1.2,<2", "defusedxml>=0.7,<1"]
eval = ["ragas>=0.2.0,<1", "datasets>=2.0.0", "langchain-openai>=0.1"]
test = ["pytest>=8,<10", "aiosqlite>=0.20,<1", "fakeredis[lua]>=2.26,<3"]

[tool.setuptools.packages.find]
include = ["app*"]
